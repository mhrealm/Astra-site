<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">滚动加载 缩略图</title>
  <desc id="desc">根据文章标题 滚动加载 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #431407;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #d97706;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="600" cy="84" r="146" />
  <circle class="orb" cx="128" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#f59e0b"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="142" height="44" rx="22" />
  <text class="tag" x="70" y="88">交互组件</text>

  <g transform="translate(426 120)">
    <rect x="0" y="156" width="244" height="40" rx="20" fill="#ffffff" opacity="0.76" />
    <rect x="22" y="169" width="152" height="14" rx="7" fill="#f59e0b" />
    <circle cx="122" cy="106" r="82" fill="#ffffff" opacity="0.76" />
    <path
      d="M70 126 A58 58 0 1 1 174 126"
      fill="none"
      stroke="#fef3c7"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M70 126 A58 58 0 0 1 158 64"
      fill="none"
      stroke="#f59e0b"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path d="M122 116 L172 80" stroke="#431407" stroke-width="8" stroke-linecap="round" />
    <circle cx="122" cy="116" r="9" fill="#431407" />
  </g>
  <text class="title-line" x="48" y="168">滚动加载</text>
  <text class="desc-line" x="50" y="340">监听滚动容器触底状态，模拟分页加载</text>
  <text class="desc-line" x="50" y="364">更多数据。</text>
  <text class="slug" x="50" y="414">interaction / refresh</text>
</svg>
