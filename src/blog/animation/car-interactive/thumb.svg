  </g>
  <text class="title-line" x="48" y="168">Vue + Three.js 实</text>
  <text class="title-line" x="48" y="222">现 3D 汽车交互展示</text>
  <text class="desc-line" x="50" y="340">上一篇基础版已经完成了模型加载、展</text>
  <text class="desc-line" x="50" y="364">台、灯光、环境反射和车漆切换。</text>
  <text class="slug" x="50" y="414">animation / car-interactive</text>
