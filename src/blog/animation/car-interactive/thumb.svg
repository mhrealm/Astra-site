  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="142" height="44" rx="22" />
  <text class="tag" x="70" y="88">动画动效</text>

  <g transform="translate(424 224)">
    <path
      d="M28 94 C52 36 100 10 178 16 L244 22 C304 28 344 58 372 96 L418 104 C440 108 454 122 454 146 L454 164 L18 164 L18 142 C18 118 22 104 28 94 Z"
      fill="#fb7185"
      opacity="0.96"
    />
    <path
      d="M114 44 L184 34 C238 34 276 52 304 88 L78 88 C88 66 98 52 114 44 Z"
      fill="#ffffff"
      opacity="0.7"
    />
    <circle cx="112" cy="166" r="42" fill="#1f2937" />
    <circle cx="346" cy="166" r="42" fill="#1f2937" />
    <circle cx="112" cy="166" r="18" fill="#ffe4e6" />
    <circle cx="346" cy="166" r="18" fill="#ffe4e6" />
    <path d="M18 130 L442 130" stroke="#ffffff" stroke-width="5" opacity="0.38" />
    <path
      d="M300 104 L412 104"
