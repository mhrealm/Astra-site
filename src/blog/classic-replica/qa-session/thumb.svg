<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">网易音乐七夕活动复刻 缩略图</title>
  <desc id="desc">根据文章标题 网易音乐七夕活动复刻 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #2e1065;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #6d28d9;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="610" cy="84" r="146" />
  <circle class="orb" cx="118" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#8b5cf6"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="142" height="44" rx="22" />
  <text class="tag" x="70" y="88">经典复刻</text>

  <g transform="translate(414 112)">
    <rect x="0" y="0" width="266" height="212" rx="24" fill="#ffffff" opacity="0.78" />
    <path
      d="M42 58 L82 98 L42 138"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M118 58 H222 M118 98 H196 M118 138 H236"
      stroke="#ede9fe"
      stroke-width="12"
      stroke-linecap="round"
    />
    <circle cx="78" cy="176" r="12" fill="#6d28d9" />
    <circle cx="134" cy="176" r="12" fill="#6d28d9" opacity="0.7" />
    <circle cx="190" cy="176" r="12" fill="#6d28d9" opacity="0.45" />
  </g>
  <text class="title-line" x="48" y="168">网易音乐七夕活动复</text>
  <text class="title-line" x="48" y="222">刻</text>
  <text class="desc-line" x="50" y="340">前言 在日常的开发过程中，我们常常</text>
  <text class="desc-line" x="50" y="364">需要复刻某些经典的需求———— 既...</text>
  <text class="slug" x="50" y="414">classic-replica / qa-session</text>
</svg>
