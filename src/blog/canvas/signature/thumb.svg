<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Canvas 电子签名 缩略图</title>
  <desc id="desc">根据文章标题 Canvas 电子签名 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #164e63;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #0e7490;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="600" cy="84" r="146" />
  <circle class="orb" cx="128" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#06b6d4"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="267" height="44" rx="22" />
  <text class="tag" x="70" y="88">Animation</text>

  <g transform="translate(420 112)">
    <rect x="0" y="0" width="246" height="246" rx="24" fill="#ffffff" opacity="0.78" />
    <path
      d="M28 206 H218 M28 164 H218 M28 122 H218 M28 80 H218 M72 34 V218 M122 34 V218 M172 34 V218"
      stroke="#cffafe"
      stroke-width="3"
    />
    <circle cx="80" cy="92" r="36" fill="#06b6d4" opacity="0.9" />
    <rect x="128" y="128" width="76" height="56" rx="14" fill="#0e7490" opacity="0.9" />
    <path
      d="M54 180 C100 118 136 208 204 82"
      fill="none"
      stroke="#164e63"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>
  <text class="title-line" x="48" y="168">Canvas 电子签名</text>
  <text class="desc-line" x="50" y="340">实现可书写、清空和保存的 Canvas 签</text>
  <text class="desc-line" x="50" y="364">名面板。</text>
  <text class="slug" x="50" y="414">canvas / signature</text>
</svg>
