<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">怎么实现强制刷新组件？ 缩略图</title>
  <desc id="desc">根据文章标题 怎么实现强制刷新组件？ 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42b883" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #064e3b;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #2f855a;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="592" cy="84" r="146" />
  <circle class="orb" cx="136" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#42b883"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="192" height="44" rx="22" />
  <text class="tag" x="70" y="88">Vue</text>

  <g transform="translate(420 120)">
    <rect x="0" y="0" width="242" height="160" rx="24" fill="#ffffff" opacity="0.78" />
    <rect x="30" y="34" width="92" height="34" rx="17" fill="#42b883" opacity="0.95" />
    <rect x="134" y="34" width="70" height="34" rx="17" fill="#d1fae5" />
    <rect x="30" y="88" width="174" height="14" rx="7" fill="#d1fae5" />
    <rect x="30" y="118" width="118" height="14" rx="7" fill="#d1fae5" />
    <path
      d="M174 184 L138 88 L226 132 L188 144 L214 188 L190 202 L164 156 Z"
      fill="#064e3b"
      opacity="0.9"
    />
  </g>
  <text class="title-line" x="48" y="168">怎么实现强制刷新组</text>
  <text class="title-line" x="48" y="222">件？</text>
  <text class="desc-line" x="50" y="340">对比 key 变化和 v-if 重挂载两种强</text>
  <text class="desc-line" x="50" y="364">制刷新组件的方式。</text>
  <text class="slug" x="50" y="414">vue / component-refresh</text>
</svg>
