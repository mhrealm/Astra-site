<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">混合模式 缩略图</title>
  <desc id="desc">根据文章标题 混合模式 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #1e3a8a;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #2563eb;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="596" cy="84" r="146" />
  <circle class="orb" cx="132" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#60a5fa"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="267" height="44" rx="22" />
  <text class="tag" x="70" y="88">CSS 布局与效果</text>

  <g transform="translate(414 112)">
    <rect x="22" y="18" width="224" height="142" rx="22" fill="#dbeafe" opacity="0.95" />
    <rect x="0" y="52" width="224" height="142" rx="22" fill="#ffffff" opacity="0.78" />
    <rect x="44" y="86" width="224" height="142" rx="22" fill="#60a5fa" opacity="0.84" />
    <path
      d="M72 124 H212 M72 160 H174 M72 196 H234"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.7"
    />
  </g>
  <text class="title-line" x="48" y="168">混合模式</text>
  <text class="desc-line" x="50" y="340">演示 CSS mix-blend-mode 的视觉叠加</text>
  <text class="desc-line" x="50" y="364">效果。</text>
  <text class="slug" x="50" y="414">css-effects / blend-mode</text>
</svg>
