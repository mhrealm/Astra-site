<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">使用 Canvas 压缩图片 缩略图</title>
  <desc id="desc">根据文章标题 使用 Canvas 压缩图片 生成的博客缩略图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2129" flood-opacity="0.12" />
    </filter>
    <style>
      .bg {
        fill: url(#bg);
      }
      .orb {
        fill: url(#accent);
        opacity: 0.16;
      }
      .panel {
        fill: rgba(255, 255, 255, 0.68);
        stroke: rgba(255, 255, 255, 0.72);
        filter: url(#shadow);
      }
      .tag {
        fill: #1e3a8a;
        font:
          700 22px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .tag-bg {
        fill: rgba(255, 255, 255, 0.72);
        stroke: rgba(255, 255, 255, 0.9);
      }
      .title-line {
        fill: #1d2129;
        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
        fill: #1d4ed8;
        font:
          700 16px 'Cascadia Mono',
          Consolas,
          monospace;
        opacity: 0.8;
      }
      .size {
        fill: #1e3a8a;
        font:
          700 15px 'Cascadia Mono',
          Consolas,
          monospace;
      }
    </style>
  </defs>
  <rect class="bg" width="720" height="480" rx="36" />
  <circle class="orb" cx="604" cy="84" r="146" />
  <circle class="orb" cx="124" cy="432" r="174" />
  <path
    d="M0 366 C112 326 178 384 286 344 C390 306 492 246 720 286 L720 480 L0 480 Z"
    fill="#3b82f6"
    opacity="0.08"
  />
  <rect class="panel" x="28" y="28" width="664" height="424" rx="30" />
  <rect class="tag-bg" x="48" y="58" width="142" height="44" rx="22" />
  <text class="tag" x="70" y="88">性能优化</text>

  <g transform="translate(352 128)">
    <!-- 原图：大画框 -->
    <rect x="0" y="0" width="150" height="120" rx="14" fill="#ffffff" opacity="0.9" />
    <rect x="12" y="12" width="126" height="96" rx="8" fill="#dbeafe" />
    <circle cx="44" cy="40" r="12" fill="#93c5fd" />
    <path d="M12 108 L58 62 L88 90 L108 72 L138 102 L138 108 Z" fill="#3b82f6" opacity="0.75" />
    <text class="size" x="40" y="146">4.8 MB</text>

    <!-- 箭头 -->
    <path
      d="M166 60 L208 60"
      stroke="#1d4ed8"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path
      d="M196 46 L212 60 L196 74"
      fill="none"
      stroke="#1d4ed8"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 压缩后：小画框 -->
    <rect x="226" y="24" width="90" height="72" rx="10" fill="#ffffff" opacity="0.9" />
    <rect x="234" y="32" width="74" height="56" rx="6" fill="#dbeafe" />
    <circle cx="253" cy="48" r="7" fill="#93c5fd" />
    <path d="M234 88 L261 61 L279 78 L291 67 L308 84 L308 88 Z" fill="#3b82f6" opacity="0.75" />
    <text class="size" x="236" y="122">320 KB</text>
  </g>
  <text class="title-line" x="48" y="168">使用 Canvas</text>
  <text class="title-line" x="48" y="220">压缩图片</text>
  <text class="desc-line" x="50" y="340">上传前缩放并重新编码图片，</text>
  <text class="desc-line" x="50" y="364">减少传输体积。</text>
  <text class="slug" x="50" y="414">performance / canvas-image-compress</text>
</svg>
