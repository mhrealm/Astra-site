        font:
          800 40px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .desc-line {
        fill: #4e5969;
        font:
          600 18px Inter,
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }
      .slug {
